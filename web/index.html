<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tierra · Detective de Tendencias</title>
<style>
  :root {
    --fondo: #04070d;
    --panel: rgba(11, 20, 32, 0.86);
    --borde: rgba(120, 200, 255, 0.14);
    --texto: #dce9f5;
    --secundario: #7e97ad;
    --cian: #35d6ff;
    --verde: #58e39a;
    --ambar: #ffb454;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--fondo); color: var(--texto);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif; overflow: hidden; }
  #lienzo { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #marca { position: fixed; top: 22px; left: 26px; pointer-events: none; }
  #marca h1 { font-size: 22px; letter-spacing: 0.32em; font-weight: 600; color: var(--cian); }
  #marca p { font-size: 12px; color: var(--secundario); letter-spacing: 0.08em; margin-top: 4px; }

  #variables { position: fixed; top: 22px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 6px; background: var(--panel); padding: 6px;
    border: 1px solid var(--borde); border-radius: 10px; backdrop-filter: blur(8px); }
  #variables button { background: transparent; border: 0; color: var(--secundario);
    font: inherit; font-size: 12px; padding: 7px 12px; border-radius: 7px; cursor: pointer; }
  #variables button:hover { color: var(--texto); }
  #variables button.activa { background: rgba(53, 214, 255, 0.14); color: var(--cian); }

  #chips { position: fixed; top: 22px; right: 26px; display: flex; gap: 6px; }
  #chips button { background: var(--panel); border: 1px solid var(--borde); color: var(--texto);
    font: inherit; font-size: 11px; padding: 6px 10px; border-radius: 999px; cursor: pointer; }
  #chips button:hover { border-color: var(--cian); color: var(--cian); }
  #chips button.capa.activa { border-color: var(--ambar); color: var(--ambar); }

  #leyenda { position: fixed; left: 26px; bottom: 26px; width: 236px;
    background: var(--panel); border: 1px solid var(--borde); border-radius: 12px;
    padding: 12px 14px; font-size: 11px; color: var(--secundario); backdrop-filter: blur(8px); }
  #leyenda strong { display: block; color: var(--texto); font-size: 12px; margin-bottom: 2px; }
  #leyenda .barra { height: 8px; border-radius: 4px; margin: 8px 0 4px; }
  #leyenda .extremos { display: flex; justify-content: space-between; font-family: ui-monospace, Consolas, monospace; }
  #leyenda .nota { margin-top: 6px; line-height: 1.4; }
  #filtro { display: flex; align-items: center; gap: 6px; margin-top: 8px; color: var(--texto); }
  #filtro input { accent-color: var(--cian); }

  #panel { position: fixed; top: 84px; right: 22px; width: 380px; max-height: calc(100vh - 110px);
    overflow-y: auto; background: var(--panel); border: 1px solid var(--borde);
    border-radius: 14px; padding: 18px; backdrop-filter: blur(10px);
    transform: translateX(430px); opacity: 0; pointer-events: none;
    transition: transform .32s ease, opacity .32s ease; }
  #panel.visible { transform: none; opacity: 1; pointer-events: auto; }
  #panel h2 { font-size: 13px; letter-spacing: .18em; color: var(--cian); text-transform: uppercase; }
  #panel-coords { font-size: 11px; color: var(--secundario); margin: 4px 0 12px; }
  #panel-pendiente { font-family: ui-monospace, Consolas, monospace; font-size: 34px; line-height: 1.1; }
  #panel-insignia { display: inline-block; margin-top: 6px; font-size: 11px;
    padding: 3px 8px; border-radius: 999px; border: 1px solid var(--borde); color: var(--secundario); }
  #panel-insignia.significativa { color: var(--verde); border-color: rgba(88, 227, 154, .5); }
  #panel-cambio { font-size: 12px; color: var(--secundario); margin-top: 8px; }
  #panel-serie { width: 100%; height: 130px; display: block; margin: 14px 0 6px; }
  #panel-eventos { font-size: 12px; color: var(--secundario); margin-top: 6px; }
  #panel-aviso { font-size: 11px; color: var(--ambar); margin-top: 8px; }
  #panel-error { display: none; margin-top: 12px; font-size: 12px; color: #ffb3b3; }
  #panel-error.visible { display: block; }
  #panel-error button { margin-top: 8px; background: transparent; color: var(--cian);
    border: 1px solid var(--borde); border-radius: 7px; padding: 5px 10px; font: inherit; cursor: pointer; }
  #panel-cerrar { position: absolute; top: 12px; right: 12px; background: transparent;
    border: 0; color: var(--secundario); font-size: 18px; cursor: pointer; line-height: 1; }
  #panel-cerrar:hover { color: var(--texto); }

  #aviso { position: fixed; inset: 0; display: grid; place-items: center;
    background: var(--fondo); color: var(--texto); padding: 32px; text-align: center; }
  #aviso[hidden] { display: none; }
  #aviso h2 { font-size: 20px; margin-bottom: 10px; }
  #aviso p { color: var(--secundario); max-width: 460px; line-height: 1.5; }
</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<header id="marca">
  <h1>TIERRA</h1>
  <p id="subtitulo">Detective de tendencias · NASA POWER 1984–2025</p>
</header>
<nav id="variables"></nav>
<div id="chips">
  <button data-lat="78" data-lon="15">Ártico</button>
  <button data-lat="-3" data-lon="-62">Amazonía</button>
  <button data-lat="18" data-lon="-72">Caribe</button>
  <button data-lat="14" data-lon="0">Sahel</button>
  <button data-lat="48" data-lon="10">Europa</button>
  <button id="capa-incendios" class="capa">Incendios</button>
  <button id="capa-tormentas" class="capa">Tormentas</button>
  <button id="capa-activos" class="capa">Activos 7 d</button>
</div>
<aside id="leyenda"></aside>
<aside id="panel">
  <button id="panel-cerrar" aria-label="Cerrar panel">×</button>
  <h2 id="panel-titulo">Celda</h2>
  <p id="panel-coords"></p>
  <div id="panel-pendiente"></div>
  <div id="panel-insignia"></div>
  <div id="panel-cambio"></div>
  <canvas id="panel-serie"></canvas>
  <div id="panel-eventos"></div>
  <div id="panel-aviso"></div>
  <div id="panel-error">
    <span id="panel-error-texto"></span>
    <button id="panel-reintentar">Reintentar</button>
  </div>
</aside>
<div id="aviso" hidden>
  <div>
    <h2>Este navegador no puede dibujar el globo</h2>
    <p>Necesitas WebGL 2 y un navegador actualizado (Chrome o Edge).
       El resto de la información seguiría disponible, pero el mapa 3D no.</p>
  </div>
</div>

<script id="malla" type="application/json">{"version":1,"res":5,"anio_ini":1984,"anio_fin":2025,"variables":[],"celdas":[]}</script>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const EQUIPO = '';
const TEXTURAS = 'https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/';
const lienzo = document.getElementById('lienzo');

if (EQUIPO) {
  document.getElementById('subtitulo').textContent += ' · ' + EQUIPO;
}

if (!window.WebGL2RenderingContext) {
  document.getElementById('aviso').hidden = false;
}

const renderer = new THREE.WebGLRenderer({
  canvas: lienzo,
  antialias: true,
  powerPreference: 'high-performance',
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x04070d, 1);
renderer.outputColorSpace = THREE.SRGBColorSpace;

const escena = new THREE.Scene();
const camara = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 200);
camara.position.set(0.7, 0.35, 3.1);

const controles = new OrbitControls(camara, lienzo);
controles.enablePan = false;
controles.enableDamping = true;
controles.dampingFactor = 0.06;
controles.rotateSpeed = 0.5;
controles.zoomSpeed = 0.7;
controles.minDistance = 1.35;
controles.maxDistance = 5.5;

const VARIABLES_DEFECTO = [
  { id: 'T2M', nombre: 'Temperatura', unidad: '°C/década', dominio: 0.8 },
  { id: 'PRECTOTCORR', nombre: 'Lluvia', unidad: 'mm/año por década', dominio: 80 },
  { id: 'WS2M', nombre: 'Viento', unidad: 'm/s por década', dominio: 0.15 },
  { id: 'RH2M', nombre: 'Humedad', unidad: '%/década', dominio: 2 },
];
const PALETAS = {
  T2M: [[43, 108, 255], [245, 247, 250], [255, 59, 48]],
  PRECTOTCORR: [[181, 101, 29], [245, 247, 250], [30, 136, 229]],
  WS2M: [[123, 47, 247], [245, 247, 250], [0, 200, 83]],
  RH2M: [[194, 163, 107], [245, 247, 250], [0, 184, 169]],
};

const malla = JSON.parse(document.getElementById('malla').textContent);
const variables = (malla.variables && malla.variables.length)
  ? malla.variables : VARIABLES_DEFECTO;
const res = malla.res || 5;
const columnas = Math.round(360 / res);
const filas = Math.round(180 / res);

const estado = {
  variable: variables[0].id,
  soloSignificativas: false,
  celda: null,
};

function interpolar(paleta, t, alfa = 255) {
  const [izquierda, centro, derecha] = paleta;
  const desde = t < 0 ? centro : centro;
  const hacia = t < 0 ? izquierda : derecha;
  const paso = Math.abs(t);
  return [
    Math.round(desde[0] + (hacia[0] - desde[0]) * paso),
    Math.round(desde[1] + (hacia[1] - desde[1]) * paso),
    Math.round(desde[2] + (hacia[2] - desde[2]) * paso),
    alfa,
  ];
}

function indiceVariable(id) {
  return Math.max(0, variables.findIndex((variable) => variable.id === id));
}

function colorCelda(indice) {
  const celda = malla.celdas[indice];
  if (!celda) {
    return [128, 128, 128, 0];
  }
  const posicion = 2 + indiceVariable(estado.variable) * 3;
  const pendiente = celda[posicion];
  const p = celda[posicion + 1];
  if (pendiente === null || pendiente === undefined) {
    return estado.soloSignificativas ? [128, 128, 128, 0] : [128, 128, 128, 255];
  }
  const variable = variables[indiceVariable(estado.variable)];
  const paleta = PALETAS[variable.id] || PALETAS.T2M;
  const dominio = variable.dominio || 1;
  const t = Math.max(-1, Math.min(1, pendiente / dominio));
  const significativa = p !== null && p !== undefined && p < 0.05;
  if (estado.soloSignificativas && !significativa) {
    return interpolar(paleta, t, 0);
  }
  return interpolar(paleta, t, significativa ? 255 : 77);
}

function indiceCelda(lat, lon) {
  let mejor = -1;
  let mejorDistancia = Infinity;
  const longitud = ((lon + 180) % 360 + 360) % 360 - 180;
  malla.celdas.forEach((celda, indice) => {
    let delta = Math.abs(celda[1] - longitud);
    if (delta > 180) {
      delta = 360 - delta;
    }
    const distancia = (celda[0] - lat) ** 2 + delta ** 2;
    if (distancia < mejorDistancia) {
      mejorDistancia = distancia;
      mejor = indice;
    }
  });
  return mejor;
}

const anchoTextura = 1440;
const altoTextura = 720;
const lienzoMalla = document.createElement('canvas');
lienzoMalla.width = anchoTextura;
lienzoMalla.height = altoTextura;
const contexto = lienzoMalla.getContext('2d');
const texturaMalla = new THREE.CanvasTexture(lienzoMalla);
texturaMalla.colorSpace = THREE.SRGBColorSpace;
texturaMalla.magFilter = THREE.LinearFilter;
texturaMalla.minFilter = THREE.LinearFilter;
texturaMalla.generateMipmaps = false;

const capaMalla = new THREE.Mesh(
  new THREE.SphereGeometry(1.004, 128, 96),
  new THREE.MeshBasicMaterial({
    map: texturaMalla, transparent: true, depthWrite: false,
  }),
);
capaMalla.renderOrder = 2;

function pintar() {
  contexto.clearRect(0, 0, anchoTextura, altoTextura);
  const ancho = anchoTextura / columnas;
  const alto = altoTextura / filas;
  malla.celdas.forEach((celda, indice) => {
    const color = colorCelda(indice);
    if (color[3] === 0) {
      return;
    }
    const x = ((celda[1] + 180) / 360) * anchoTextura - ancho / 2;
    const y = ((90 - celda[0]) / 180) * altoTextura - alto / 2;
    contexto.fillStyle = `rgba(${color[0]},${color[1]},${color[2]},${color[3] / 255})`;
    contexto.fillRect(x, y, ancho, alto);
  });
  texturaMalla.needsUpdate = true;
  actualizarLeyenda();
}

function actualizarLeyenda() {
  const variable = variables[indiceVariable(estado.variable)];
  const paleta = PALETAS[variable.id] || PALETAS.T2M;
  const dominio = variable.dominio || 1;
  const leyenda = document.getElementById('leyenda');
  leyenda.innerHTML = `
    <strong>${variable.nombre} · ${variable.unidad}</strong>
    <div class="barra" style="background: linear-gradient(90deg, rgb(${paleta[0]}), rgb(${paleta[1]}), rgb(${paleta[2]}))"></div>
    <div class="extremos"><span>−${dominio}</span><span>0</span><span>+${dominio}</span></div>
    <label id="filtro"><input type="checkbox" id="solo-significativas"> Solo significativas</label>
    <div class="nota">Opaco = tendencia significativa (p &lt; 0,05).<br>Gris = sin dato para esta variable.</div>`;
  const casilla = document.getElementById('solo-significativas');
  casilla.checked = estado.soloSignificativas;
  casilla.addEventListener('change', (evento) => {
    estado.soloSignificativas = evento.target.checked;
    pintar();
  });
}

function cambiarVariable(id) {
  if (!variables.some((variable) => variable.id === id)) {
    return;
  }
  estado.variable = id;
  document.querySelectorAll('#variables button').forEach((boton) => {
    boton.classList.toggle('activa', boton.dataset.variable === id);
  });
  pintar();
  if (datosCelda && document.getElementById('panel').classList.contains('visible')
      && estado.celda !== null && malla.celdas[estado.celda]) {
    const celda = malla.celdas[estado.celda];
    document.getElementById('panel-titulo').textContent =
      variables[indiceVariable(id)].nombre;
    pintarPanel(datosCelda, celda, variables[indiceVariable(id)]);
  }
}

function repintar() {
  pintar();
}

function construirPestanas() {
  const contenedor = document.getElementById('variables');
  variables.forEach((variable) => {
    const boton = document.createElement('button');
    boton.textContent = variable.nombre;
    boton.dataset.variable = variable.id;
    boton.addEventListener('click', () => cambiarVariable(variable.id));
    contenedor.appendChild(boton);
  });
  cambiarVariable(estado.variable);
}

let destinoCamara = null;
function volarA(lat, lon) {
  const radio = camara.position.length();
  const la = lat * Math.PI / 180;
  const lo = lon * Math.PI / 180;
  destinoCamara = new THREE.Vector3(
    Math.cos(la) * Math.cos(lo),
    Math.sin(la),
    -Math.cos(la) * Math.sin(lo),
  ).multiplyScalar(radio);
}

document.querySelectorAll('#chips button').forEach((boton) => {
  boton.addEventListener('click', () => {
    volarA(Number(boton.dataset.lat), Number(boton.dataset.lon));
  });
});

function estrellas() {
  const total = 1600;
  const posiciones = new Float32Array(total * 3);
  for (let i = 0; i < total; i++) {
    const radio = 26 + Math.random() * 40;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    posiciones[i * 3] = radio * Math.sin(phi) * Math.cos(theta);
    posiciones[i * 3 + 1] = radio * Math.cos(phi);
    posiciones[i * 3 + 2] = radio * Math.sin(phi) * Math.sin(theta);
  }
  const geometria = new THREE.BufferGeometry();
  geometria.setAttribute('position', new THREE.BufferAttribute(posiciones, 3));
  const material = new THREE.PointsMaterial({
    color: 0x9fc7ff, size: 0.26, sizeAttenuation: true,
    transparent: true, opacity: 0.85,
  });
  return new THREE.Points(geometria, material);
}

async function cargarTextura(nombre) {
  const cargador = new THREE.TextureLoader();
  cargador.setCrossOrigin('anonymous');
  try {
    const textura = await Promise.race([
      cargador.loadAsync(TEXTURAS + nombre),
      new Promise((_, rechazar) => setTimeout(() => rechazar(new Error('timeout')), 8000)),
    ]);
    textura.colorSpace = THREE.SRGBColorSpace;
    return textura;
  } catch (error) {
    return null;
  }
}

const globo = new THREE.Group();
const nubes = new THREE.Group();
const atmosfera = new THREE.Mesh(
  new THREE.SphereGeometry(1.12, 64, 48),
  new THREE.ShaderMaterial({
    transparent: true,
    blending: THREE.AdditiveBlending,
    side: THREE.BackSide,
    depthWrite: false,
    vertexShader: `
      varying vec3 vNormal;
      varying vec3 vPos;
      void main() {
        vNormal = normalize(normalMatrix * normal);
        vPos = (modelViewMatrix * vec4(position, 1.0)).xyz;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      varying vec3 vNormal;
      varying vec3 vPos;
      void main() {
        float fresnel = pow(1.0 - abs(dot(normalize(vNormal), normalize(-vPos))), 3.0);
        gl_FragColor = vec4(0.16, 0.48, 0.95, fresnel * 0.65);
      }`,
  }),
);

const texturas = { ok: false };

function materialGlobo(dia, noche) {
  if (!dia) {
    return new THREE.MeshBasicMaterial({ color: 0x1b3a5c });
  }
  return new THREE.ShaderMaterial({
    uniforms: {
      dia: { value: dia },
      noche: { value: noche || dia },
      sol: { value: new THREE.Vector3(1.0, 0.28, 0.65).normalize() },
    },
    vertexShader: `
      varying vec2 vUv;
      varying vec3 vNormal;
      void main() {
        vUv = uv;
        vNormal = normalize(normal);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      uniform sampler2D dia;
      uniform sampler2D noche;
      uniform vec3 sol;
      varying vec2 vUv;
      varying vec3 vNormal;
      void main() {
        vec3 normal = normalize(vNormal);
        float luz = dot(normal, normalize(sol));
        float mezcla = smoothstep(-0.18, 0.28, luz);
        vec3 colorDia = texture2D(dia, vUv).rgb * (0.25 + 0.9 * max(luz, 0.0));
        vec3 colorNoche = texture2D(noche, vUv).rgb * 1.15;
        vec3 color = mix(colorNoche, colorDia, mezcla);
        gl_FragColor = vec4(color, 1.0);
      }`,
  });
}

async function montarGlobo() {
  const [dia, noche, nubesTex] = await Promise.all([
    cargarTextura('earth_atmos_2048.jpg'),
    cargarTextura('earth_lights_2048.png'),
    cargarTextura('earth_clouds_1024.png'),
  ]);
  texturas.ok = Boolean(dia && noche && nubesTex);

  const esfera = new THREE.Mesh(
    new THREE.SphereGeometry(1, 96, 64),
    materialGlobo(dia, noche),
  );
  esferaGlobo = esfera;
  globo.add(esfera);
  globo.add(capaMalla);

  if (nubesTex) {
    const capa = new THREE.Mesh(
      new THREE.SphereGeometry(1.012, 64, 48),
      new THREE.MeshBasicMaterial({
        map: nubesTex, transparent: true, opacity: 0.55,
        depthWrite: false, blending: THREE.NormalBlending,
      }),
    );
    nubes.add(capa);
  }

  escena.add(estrellas());
  escena.add(globo);
  escena.add(nubes);
  escena.add(atmosfera);
}

const reloj = new THREE.Clock();
let primerFrame = true;

function animar() {
  requestAnimationFrame(animar);
  const t = reloj.getElapsedTime();
  nubes.rotation.y = t * 0.006;
  if (destinoCamara) {
    camara.position.lerp(destinoCamara, 0.08);
    if (camara.position.distanceTo(destinoCamara) < 0.01) {
      destinoCamara = null;
    }
  }
  controles.update();
  renderer.render(escena, camara);
  if (primerFrame && escena.children.length > 0) {
    primerFrame = false;
    window.__tierra.listo = true;
  }
}

const POWER_URL = 'https://power.larc.nasa.gov/api/temporal/monthly/point';
const ANIO_INI = 1984;
const ANIO_FIN = 2025;
const FACTORES = { T2M: 1, PRECTOTCORR: 365.25, WS2M: 1, RH2M: 1 };
const UMBRAL_SIGNIFICANCIA = 0.05;

function sen(valores) {
  if (valores.length < 3) {
    return null;
  }
  const pendientes = [];
  for (let i = 0; i < valores.length - 1; i++) {
    for (let j = i + 1; j < valores.length; j++) {
      pendientes.push((valores[j] - valores[i]) / (j - i));
    }
  }
  pendientes.sort((a, b) => a - b);
  const total = pendientes.length;
  const medio = Math.floor(total / 2);
  return total % 2
    ? pendientes[medio]
    : (pendientes[medio - 1] + pendientes[medio]) / 2;
}

function erf(x) {
  const signo = Math.sign(x);
  const valor = Math.abs(x);
  const t = 1 / (1 + 0.3275911 * valor);
  const polinomio = (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t
    - 0.284496736) * t + 0.254829592) * t;
  return signo * (1 - polinomio * Math.exp(-valor * valor));
}

function mannKendall(valores) {
  const n = valores.length;
  if (n < 10) {
    return null;
  }
  let s = 0;
  for (let i = 0; i < n - 1; i++) {
    for (let j = i + 1; j < n; j++) {
      if (valores[j] > valores[i]) s += 1;
      else if (valores[j] < valores[i]) s -= 1;
    }
  }
  const conteos = new Map();
  valores.forEach((valor) => conteos.set(valor, (conteos.get(valor) || 0) + 1));
  let varianza = n * (n - 1) * (2 * n + 5);
  conteos.forEach((t) => { varianza -= t * (t - 1) * (2 * t + 5); });
  varianza /= 18.0;
  if (varianza <= 0) {
    return { z: 0, p: 1 };
  }
  const z = s > 0 ? (s - 1) / Math.sqrt(varianza)
    : s < 0 ? (s + 1) / Math.sqrt(varianza) : 0;
  const p = 2 * (1 - 0.5 * (1 + erf(Math.abs(z) / Math.SQRT2)));
  return { z, p };
}

function serieDe(datos, variableId) {
  const series = (datos.properties && datos.properties.parameter
    && datos.properties.parameter[variableId]) || {};
  const valores = [];
  for (let anio = ANIO_INI; anio <= ANIO_FIN; anio++) {
    const bruto = series[`${anio}13`];
    const numero = Number(bruto);
    valores.push(
      bruto === undefined || bruto === null || Number.isNaN(numero) || numero <= -998
        ? null : numero,
    );
  }
  return valores;
}

function dibujarSerie(serie, pendienteCruda) {
  const canvas = document.getElementById('panel-serie');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const ancho = canvas.clientWidth || 344;
  const alto = 130;
  canvas.width = Math.round(ancho * dpr);
  canvas.height = Math.round(alto * dpr);
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, ancho, alto);

  const validos = serie.filter((valor) => valor !== null);
  if (validos.length < 2) {
    return;
  }
  const minimo = Math.min(...validos);
  const maximo = Math.max(...validos);
  const rango = maximo - minimo || 1;
  const margen = 12;
  const x = (indice) => margen + (indice / (serie.length - 1)) * (ancho - margen * 2);
  const y = (valor) => alto - margen - ((valor - minimo) / rango) * (alto - margen * 2);

  ctx.strokeStyle = 'rgba(120, 200, 255, 0.18)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(margen, alto - margen);
  ctx.lineTo(ancho - margen, alto - margen);
  ctx.stroke();

  ctx.strokeStyle = '#35d6ff';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  let abierto = false;
  serie.forEach((valor, indice) => {
    if (valor === null) {
      abierto = false;
      return;
    }
    if (!abierto) {
      ctx.moveTo(x(indice), y(valor));
      abierto = true;
    } else {
      ctx.lineTo(x(indice), y(valor));
    }
  });
  ctx.stroke();

  const inicio = serie.findIndex((valor) => valor !== null);
  const fin = serie.length - 1 - [...serie].reverse().findIndex((valor) => valor !== null);
  if (pendienteCruda && inicio >= 0 && fin > inicio) {
    ctx.strokeStyle = 'rgba(255, 180, 84, 0.9)';
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(x(inicio), y(serie[inicio]));
    ctx.lineTo(x(fin), y(serie[inicio] + pendienteCruda * (fin - inicio)));
    ctx.stroke();
    ctx.setLineDash([]);
  }
}

let datosCelda = null;
let peticionActual = null;

function abrirPanel(celda) {
  document.getElementById('panel').classList.add('visible');
  document.getElementById('panel-titulo').textContent =
    variables[indiceVariable(estado.variable)].nombre;
  if (celda) {
    const kilometros = Math.round(res * 111);
    document.getElementById('panel-coords').textContent =
      `${celda[0]}°, ${celda[1]}° · celda de ${res}° (~${kilometros} km)`;
    const eventos = contarEventos(celda);
    document.getElementById('panel-eventos').textContent =
      `${eventos.incendios} incendios · ${eventos.tormentas} tormentas cerca (2016–2025)`;
  }
  document.getElementById('panel-error').classList.remove('visible');
  document.getElementById('panel-aviso').textContent = '';
}

function cerrarPanel() {
  document.getElementById('panel').classList.remove('visible');
  estado.celda = null;
}

function mostrarCargando() {
  document.getElementById('panel-pendiente').textContent = '…';
  document.getElementById('panel-insignia').textContent = 'Consultando NASA POWER';
  document.getElementById('panel-insignia').className = '';
  document.getElementById('panel-cambio').textContent = '';
  document.getElementById('panel-error').classList.remove('visible');
}

function mostrarError() {
  document.getElementById('panel-pendiente').textContent = '—';
  document.getElementById('panel-insignia').textContent = 'Sin serie';
  document.getElementById('panel-insignia').className = '';
  document.getElementById('panel-error-texto').textContent =
    'No pudimos consultar NASA POWER. Revisa la conexión e inténtalo de nuevo.';
  document.getElementById('panel-error').classList.add('visible');
}

function mostrarSinDatos(variable) {
  document.getElementById('panel-pendiente').textContent = '—';
  document.getElementById('panel-insignia').textContent = 'Sin datos para esta variable';
  document.getElementById('panel-insignia').className = '';
  document.getElementById('panel-cambio').textContent = '';
  const canvas = document.getElementById('panel-serie');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

function pintarPanel(datos, celda, variable) {
  const serie = serieDe(datos, variable.id);
  const factor = FACTORES[variable.id] || 1;
  const validos = serie.filter((valor) => valor !== null).map((valor) => valor * factor);
  if (validos.length < 10) {
    mostrarSinDatos(variable);
    return;
  }
  const pendiente = sen(validos) * 10;
  const prueba = mannKendall(validos);
  const p = prueba ? prueba.p : null;
  const signo = pendiente >= 0 ? '+' : '';
  document.getElementById('panel-pendiente').textContent =
    `${signo}${pendiente.toFixed(2)} ${variable.unidad}`;

  const insignia = document.getElementById('panel-insignia');
  if (p !== null && p < UMBRAL_SIGNIFICANCIA) {
    insignia.textContent = `Significativo · p = ${p.toFixed(4)}`;
    insignia.className = 'significativa';
  } else {
    insignia.textContent = `Sin tendencia clara · p = ${p === null ? '—' : p.toFixed(2)}`;
    insignia.className = '';
  }

  const decadas = (validos.length - 1) / 10;
  document.getElementById('panel-cambio').textContent =
    `Cambio total: ${signo}${(pendiente * decadas).toFixed(2)} ${variable.unidad.split('/')[0]} en ${validos.length - 1} años`;

  const posicion = 2 + indiceVariable(variable.id) * 3;
  const horneada = celda[posicion];
  if (horneada !== null && Math.abs(horneada - pendiente) > Math.abs(variable.dominio) * 0.15) {
    document.getElementById('panel-aviso').textContent =
      'La serie en vivo difiere de la malla horneada; se muestra el cálculo en vivo.';
  }

  dibujarSerie(serie, sen(serie.filter((valor) => valor !== null)) * 10);
  datosCelda = datos;
}

async function seleccionar(lat, lon) {
  const indice = indiceCelda(lat, lon);
  const celda = malla.celdas[indice];
  estado.celda = indice;
  abrirPanel(celda);
  if (!celda) {
    return;
  }
  const variable = variables[indiceVariable(estado.variable)];
  const posicion = 2 + indiceVariable(estado.variable) * 3;
  if (celda[posicion] === null || celda[posicion] === undefined) {
    mostrarSinDatos(variable);
    return;
  }

  mostrarCargando();
  if (peticionActual) {
    peticionActual.abort();
  }
  peticionActual = new AbortController();

  const url = new URL(POWER_URL);
  url.searchParams.set('parameters', variables.map((item) => item.id).join(','));
  url.searchParams.set('community', 'AG');
  url.searchParams.set('latitude', String(celda[0]));
  url.searchParams.set('longitude', String(celda[1]));
  url.searchParams.set('start', String(ANIO_INI));
  url.searchParams.set('end', String(ANIO_FIN));
  url.searchParams.set('format', 'JSON');

  try {
    const respuesta = await fetch(url, { signal: peticionActual.signal });
    if (!respuesta.ok) {
      throw new Error('http');
    }
    const datos = await respuesta.json();
    pintarPanel(datos, celda, variable);
  } catch (error) {
    if (error.name !== 'AbortError') {
      mostrarError();
    }
  }
}

function latLonDe(evento) {
  if (!esferaGlobo) {
    return null;
  }
  const x = (evento.clientX / window.innerWidth) * 2 - 1;
  const y = -(evento.clientY / window.innerHeight) * 2 + 1;
  rayo.setFromCamera({ x, y }, camara);
  const golpes = rayo.intersectObject(esferaGlobo, false);
  if (!golpes.length) {
    return null;
  }
  const punto = golpes[0].point.clone().normalize();
  return {
    lat: Math.asin(punto.y) * 180 / Math.PI,
    lon: Math.atan2(-punto.z, punto.x) * 180 / Math.PI,
  };
}

let esferaGlobo = null;
const rayo = new THREE.Raycaster();
let punteroAbajo = null;

lienzo.addEventListener('pointerdown', (evento) => {
  punteroAbajo = { x: evento.clientX, y: evento.clientY };
});
lienzo.addEventListener('pointerup', (evento) => {
  if (!punteroAbajo) {
    return;
  }
  const dx = evento.clientX - punteroAbajo.x;
  const dy = evento.clientY - punteroAbajo.y;
  punteroAbajo = null;
  if (Math.hypot(dx, dy) > 6) {
    return;
  }
  const punto = latLonDe(evento);
  if (punto) {
    seleccionar(punto.lat, punto.lon);
  }
});
document.getElementById('panel-cerrar').addEventListener('click', cerrarPanel);
document.getElementById('panel-reintentar').addEventListener('click', () => {
  if (estado.celda !== null && malla.celdas[estado.celda]) {
    const celda = malla.celdas[estado.celda];
    seleccionar(celda[0], celda[1]);
  }
});

const capas = { incendios: false, tormentas: false, activos: false };
const objetosCapas = {};

function vectorDe(lat, lon) {
  const la = lat * Math.PI / 180;
  const lo = lon * Math.PI / 180;
  return new THREE.Vector3(
    Math.cos(la) * Math.cos(lo),
    Math.sin(la),
    -Math.cos(la) * Math.sin(lo),
  );
}

function crearCapa(categoria, campo, color) {
  const posiciones = [];
  const colores = [];
  malla.celdas.forEach((celda) => {
    const conteo = celda[campo] || 0;
    if (!conteo) {
      return;
    }
    const punto = vectorDe(celda[0], celda[1]).multiplyScalar(1.02);
    posiciones.push(punto.x, punto.y, punto.z);
    const intensidad = Math.min(1, 0.35 + conteo / 20);
    colores.push(color[0] * intensidad, color[1] * intensidad, color[2] * intensidad);
  });
  const geometria = new THREE.BufferGeometry();
  geometria.setAttribute('position', new THREE.Float32BufferAttribute(posiciones, 3));
  geometria.setAttribute('color', new THREE.Float32BufferAttribute(colores, 3));
  const material = new THREE.PointsMaterial({
    size: 0.03, vertexColors: true, transparent: true, opacity: 0.95,
    depthWrite: false, sizeAttenuation: true,
  });
  const puntos = new THREE.Points(geometria, material);
  puntos.visible = false;
  escena.add(puntos);
  objetosCapas[categoria] = puntos;
  return puntos;
}

crearCapa('incendios', 14, [1, 0.55, 0.2]);
crearCapa('tormentas', 15, [0.35, 0.9, 1]);

function contarEventos(celda) {
  let incendios = 0;
  let tormentas = 0;
  if (!celda) {
    return { incendios, tormentas };
  }
  malla.celdas.forEach((otra) => {
    let deltaLon = Math.abs(otra[1] - celda[1]);
    if (deltaLon > 180) {
      deltaLon = 360 - deltaLon;
    }
    if (Math.abs(otra[0] - celda[0]) <= res + 0.1 && deltaLon <= res + 0.1) {
      incendios += otra[14] || 0;
      tormentas += otra[15] || 0;
    }
  });
  return { incendios, tormentas };
}

function puntosIncendios() {
  const capa = objetosCapas.incendios;
  return capa ? capa.geometry.attributes.position.count : 0;
}

function puntosTormentas() {
  const capa = objetosCapas.tormentas;
  return capa ? capa.geometry.attributes.position.count : 0;
}

async function cargarActivos() {
  if (objetosCapas.activos) {
    objetosCapas.activos.visible = true;
    return;
  }
  try {
    const respuesta = await fetch(
      'https://eonet.gsfc.nasa.gov/api/v3/events?status=open&days=7',
    );
    if (!respuesta.ok) {
      throw new Error('http');
    }
    const datos = await respuesta.json();
    const posiciones = [];
    (datos.events || []).forEach((evento) => {
      const geometrias = evento.geometry || [];
      const ultima = geometrias[geometrias.length - 1] || {};
      if (ultima.type !== 'Point') {
        return;
      }
      const [lon, lat] = ultima.coordinates || [];
      if (typeof lat !== 'number' || typeof lon !== 'number') {
        return;
      }
      const punto = vectorDe(lat, lon).multiplyScalar(1.03);
      posiciones.push(punto.x, punto.y, punto.z);
    });
    const geometria = new THREE.BufferGeometry();
    geometria.setAttribute('position', new THREE.Float32BufferAttribute(posiciones, 3));
    const material = new THREE.PointsMaterial({
      size: 0.028, color: 0xfff2a8, transparent: true, opacity: 0.9,
      depthWrite: false, sizeAttenuation: true,
    });
    const puntos = new THREE.Points(geometria, material);
    escena.add(puntos);
    objetosCapas.activos = puntos;
  } catch (error) {
    capas.activos = false;
    document.getElementById('capa-activos').classList.remove('activa');
    objetosCapas.activos = null;
  }
}

function alternarCapa(nombre) {
  if (nombre === 'activos') {
    capas.activos = !capas.activos;
    document.getElementById('capa-activos').classList.toggle('activa', capas.activos);
    if (capas.activos) {
      cargarActivos();
    } else if (objetosCapas.activos) {
      objetosCapas.activos.visible = false;
    }
    return;
  }
  if (nombre !== 'incendios' && nombre !== 'tormentas') {
    return;
  }
  capas[nombre] = !capas[nombre];
  if (objetosCapas[nombre]) {
    objetosCapas[nombre].visible = capas[nombre];
  }
  document.getElementById('capa-' + nombre).classList.toggle('activa', capas[nombre]);
}

document.getElementById('capa-incendios').addEventListener('click', () => alternarCapa('incendios'));
document.getElementById('capa-tormentas').addEventListener('click', () => alternarCapa('tormentas'));
document.getElementById('capa-activos').addEventListener('click', () => alternarCapa('activos'));

window.__tierra = {
  listo: false,
  estado,
  datos: malla,
  variables,
  indiceCelda,
  colorCelda,
  cambiarVariable,
  repintar,
  volarA,
  seleccionar,
  cerrarPanel,
  alternarCapa,
  capas,
  puntosIncendios,
  puntosTormentas,
  globo: { escena, camara, renderer, controles, texturas, THREE },
};

window.addEventListener('resize', () => {
  camara.aspect = window.innerWidth / window.innerHeight;
  camara.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

construirPestanas();
pintar();

montarGlobo().finally(() => {
  animar();
});
</script>
